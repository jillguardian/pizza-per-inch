name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-subject.sh "$TITLE"
      - name: Check commit subjects
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          while IFS= read -r subject; do
            scripts/check-subject.sh "$subject" || failed=1
          done < <(git log --format=%s "$BASE..$HEAD")
          exit $failed
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Flags only the vulnerable dependencies this PR adds or changes, so it can
  # be a required check without failing on unrelated, existing advisories.
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
