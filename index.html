<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d9a05b" />
    <script>
      // Sets the saved color scheme before the page paints, so a saved "dark" does not flash light.
      // The key and the attribute are Mantine's own. Without a saved choice, it follows the system.
      try {
        var saved = localStorage.getItem('mantine-color-scheme-value') || 'auto'
        var dark =
          saved === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : saved === 'dark'
        document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light')
      } catch (error) {}
    </script>
    <title>Pizza per Inch | Compare pizza prices</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
